name: Welcome proposal
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  welcome:
    if: contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest
    steps:
      - name: Post voting and review guidance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "🌱 Seed planted. Use 👍 to support and 👎 to oppose. Automated overlap analysis is advisory: similar definitions may become Semantic Neighbors instead of duplicates. A term must complete Thinkgarden incubation and human harvest review before entering the Core Lexicon."
