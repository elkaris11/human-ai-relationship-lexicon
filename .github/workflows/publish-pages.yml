name: Build booklets and deploy Pages
on:
  push:
    branches: [main]
    paths:
      - "lexicon/**"
      - "thinkgarden/**"
      - "automation/build_publications.py"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: pip install -r requirements-publications.txt
      - name: Install PDF converter
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Build website, Word booklet, and Markdown edition
        run: python automation/build_publications.py
      - name: Convert Word booklet to PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir build build/Human_AI_Relationship_Lexicon.docx
          cp build/Human_AI_Relationship_Lexicon.pdf build/site/downloads/
      - name: Upload downloadable booklet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Human-AI-Relationship-Lexicon
          path: |
            build/Human_AI_Relationship_Lexicon.docx
            build/Human_AI_Relationship_Lexicon.pdf
            build/Human_AI_Relationship_Lexicon.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
