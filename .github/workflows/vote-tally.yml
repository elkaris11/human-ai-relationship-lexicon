name: Tally Thinkgarden votes
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python automation/tally_votes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
