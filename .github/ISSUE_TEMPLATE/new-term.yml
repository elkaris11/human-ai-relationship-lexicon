name: "Plant a Seedling 🌱"
description: "Propose a new term for the Human/AI Relationship Lexicon."
title: "🌱 Seedling: "
labels:
  - "proposal"
  - "stage: seed"

body:
  - type: markdown
    attributes:
      value: |
        # Plant a Seedling 🌱

        Have a word for human/AI collaboration that does not exist yet?

        Plant the idea in the Thinkgarden. The community can discuss it,
        test it in natural usage, suggest revisions, and vote on whether
        the term should eventually enter the Core Lexicon.

        Similar meanings are welcome. A related term may become a
        **Semantic Neighbor** rather than being treated as a duplicate.

  - type: input
    id: term
    attributes:
      label: Proposed term
      description: Enter only the proposed word or short phrase.
      placeholder: "Example: Contextbloom"
    validations:
      required: true

  - type: input
    id: pronunciation
    attributes:
      label: Pronunciation
      description: Optional. Explain how the term should be pronounced.
      placeholder: "Example: con-text-bloom"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      description: Choose the category that fits the term most closely.
      options:
        - Human Role
        - AI Role or Identity
        - Relationship or Connection
        - Interaction Mode
        - Creativity or Innovation
        - Productivity or Workflow
        - Culture or Humor
        - Advanced Collaboration State
        - Network or Future Culture
        - New or Unsure
    validations:
      required: true

  - type: dropdown
    id: part-of-speech
    attributes:
      label: Part of speech
      description: Choose the most likely grammatical role.
      options:
        - Noun
        - Verb
        - Adjective
        - Adverb
        - Phrase
        - Multiple or Unsure
    validations:
      required: true

  - type: textarea
    id: definition
    attributes:
      label: Proposed definition
      description: Define one primary concept in clear, ordinary language.
      placeholder: |
        The sudden emergence of useful insight after enough
        relevant context has accumulated.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example in natural use
      description: Show how someone might naturally use the term.
      placeholder: |
        "The Contextbloom happened when the final notebook
        page connected everything."
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why does this term need to exist?
      description: Explain the language gap this term would fill.
      placeholder: |
        What experience, role, workflow, relationship, or idea
        does this term help people name?
    validations:
      required: true

  - type: textarea
    id: semantic-neighbors
    attributes:
      label: Possible Semantic Neighbors
      description: List similar, broader, narrower, contrasting, or differently styled terms.
      placeholder: |
        - Contextstack: the accumulated context itself
        - Synthspark: a new idea ignited during AI collaboration
    validations:
      required: false

  - type: textarea
    id: potential-overlap
    attributes:
      label: Possible overlap or confusion
      description: Which existing terms could people confuse this with?
      placeholder: |
        Explain how this proposal differs from its closest
        Semantic Neighbors.
    validations:
      required: false

  - type: textarea
    id: boundaries
    attributes:
      label: Usage boundaries or risks
      description: Explain what the term does not mean.
      placeholder: |
        This term describes a collaborative workflow and does not
        assert AI consciousness, emotion, or independent agency.
    validations:
      required: true

  - type: textarea
    id: discussion-questions
    attributes:
      label: Questions for the community
      description: Optional questions that may help reviewers evaluate the term.
      placeholder: |
        - Is the term distinct enough from an existing term?
        - Would people use this naturally?
    validations:
      required: false

  - type: input
    id: attribution
    attributes:
      label: Public attribution
      description: Optional name or handle for public credit.
      placeholder: "Example: Elkaris11"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before planting
      options:
        - label: "I searched the Core Lexicon and open proposals for similar terms."
          required: true
        - label: "I understand that similar terms may become Semantic Neighbors instead of duplicates."
          required: true
        - label: "I understand that votes are advisory and final harvest decisions require human review."
          required: true
        - label: "I agree to follow the project Code of Conduct."
          required: true

  - type: markdown
    attributes:
      value: |
        ## What happens next?

        After submission, the proposal begins at **🌱 Seed**.

        **Seed → Germinating → Growing → Ready for Harvest**

        Reactions and comments help evaluate the term:

        - 👍 Support
        - 👎 Oppose
        - ❤️ Strong support
        - 🤔 Needs revision

        Automated analysis may identify Semantic Neighbors, but
        automation does not accept or reject terms.
